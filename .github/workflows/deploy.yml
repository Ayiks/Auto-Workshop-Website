name: Deploy to VPS
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger VPS
        uses: hostinger/deploy-on-vps@v1
        with:
          api_key: ${{ secrets.HOSTINGER_API_KEY }}
          vm_id: ${{ secrets.HOSTINGER_VM_ID }}
          # This triggers the "Update" action in your Docker Manager
