services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      CLIENT_URL: ${APP_URL}
      CRON_SECRET: ${CRON_SECRET}
      SANDBOX_TTL_HOURS: ${SANDBOX_TTL_HOURS}
      ARKESEL_API_KEY: ${ARKESEL_API_KEY}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SUPER_ADMIN_JWT_SECRET: ${SUPER_ADMIN_JWT_SECRET}
      SUPER_ADMIN_JWT_EXPIRES_IN: ${SUPER_ADMIN_JWT_EXPIRES_IN}
      SUPER_ADMIN_FULL_NAME: ${SUPER_ADMIN_FULL_NAME}

    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "8080:80"

    env_file:
      - ./frontend/.env.production
    depends_on:
      - backend

volumes:
  postgres_data:
